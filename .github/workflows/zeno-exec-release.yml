name: zeno-exec-release

on:
  push:
    tags: ["zeno-exec-v*"]

env:
  GO_VERSION: "1.23.12"
  # go.mod replaces go-zenon with ../go-zenon, so the build needs this
  # exact commit. Push it to GO_ZENON_REPO before pushing a release tag.
  GO_ZENON_REPO: digitalSloth/go-zenon
  GO_ZENON_REF: b2fa918366486105691fa970f35ca5ea727f3501

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: go-executor
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: go-executor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          repository: ${{ env.GO_ZENON_REPO }}
          ref: ${{ env.GO_ZENON_REF }}
          path: go-zenon
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: build
        run: |
          VERSION="${GITHUB_REF_NAME#zeno-exec-v}"
          scripts/release-zeno-exec.sh "$VERSION"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: go-executor/dist/zeno-exec-v*/zeno-exec-*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="${GITHUB_REF_NAME#zeno-exec-v}"
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "zeno-exec $VERSION"
          gh release upload "$GITHUB_REF_NAME" dist/zeno-exec-v${VERSION}/zeno-exec-{darwin,linux}-{amd64,arm64} dist/zeno-exec-v${VERSION}/SHA256SUMS --clobber
