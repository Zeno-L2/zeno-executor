name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # go.mod replaces go-zenon with ../../zenon-network/go-zenon, so CI checks out
  # this repository and go-zenon in that layout, with go-zenon at this commit.
  GO_ZENON_REPO: digitalSloth/go-zenon
  GO_ZENON_REF: 938fca3b7787da86827a5eb63371509b36e14761

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zeno/zeno-executor
    steps:
      - uses: actions/checkout@v4
        with:
          path: zeno/zeno-executor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GO_ZENON_REPO }}
          ref: ${{ env.GO_ZENON_REF }}
          path: zenon-network/go-zenon
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: zeno/zeno-executor/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: ./scripts/check-trie-imports.sh

  # This job exists only to keep a check literally named "build" in existence for branch
  # protection: a matrix job's checks are named "test (ubuntu-latest)" / "test (macos-latest)",
  # not "test", so a rule requiring "build" would otherwise never be satisfied. It is green only
  # when every matrix leg of "test" succeeded. Do not rename or remove it without repointing
  # branch protection first.
  build:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.test.result }}" = "success" ]'
